<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <marker id="an" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="20" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#26357A"/></marker>
    <marker id="ao" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="20" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#E07B39"/></marker>
    <marker id="as" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="20" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#3B5BA9"/></marker>
  </defs>
  <!-- ground -->
  <rect x="60" y="700" width="880" height="60" fill="#EEF2F8"/>
  <line x1="60" y1="700" x2="940" y2="700" stroke="#26357A" stroke-width="5"/>
  <!-- vertical h -->
  <line x1="420" y1="260" x2="420" y2="700" stroke="#6B7280" stroke-width="4" stroke-dasharray="12 9"/>
  <!-- FOV around optical axis (tilted 15deg) -->
  <polygon points="420,260 432,700 650,700" fill="#7DB3E0" fill-opacity="0.22"/>
  <!-- optical axis d -->
  <line x1="420" y1="260" x2="538" y2="700" stroke="#E07B39" stroke-width="6"/>
  <circle cx="538" cy="700" r="9" fill="#E07B39"/>
  <!-- angle arc theta -->
  <path d="M420,440 A180,180 0 0 0 466,434" fill="none" stroke="#26357A" stroke-width="5"/>
  <!-- drone (rotated 15 deg) -->
  <g transform="rotate(-15 420 240)">
    <line x1="270" y1="240" x2="570" y2="240" stroke="#26357A" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="275" cy="212" rx="72" ry="8" fill="#CFE2F4" stroke="#26357A" stroke-width="3"/>
    <ellipse cx="565" cy="212" rx="72" ry="8" fill="#CFE2F4" stroke="#26357A" stroke-width="3"/>
    <rect x="270" y="214" width="10" height="24" fill="#26357A"/><rect x="560" y="214" width="10" height="24" fill="#26357A"/>
    <rect x="360" y="215" width="120" height="50" rx="14" fill="#26357A"/>
    <rect x="400" y="262" width="34" height="18" rx="4" fill="#1B2559"/>
    <!-- body axes -->
    <line x1="420" y1="240" x2="640" y2="240" stroke="#3B5BA9" stroke-width="5" marker-end="url(#as)"/>
  </g>
  <!-- velocity -->
  <line x1="600" y1="150" x2="780" y2="150" stroke="#E07B39" stroke-width="6" marker-end="url(#ao)"/>
  <!-- world axes -->
  <line x1="110" y1="560" x2="220" y2="560" stroke="#26357A" stroke-width="5" marker-end="url(#an)"/>
  <line x1="110" y1="560" x2="110" y2="670" stroke="#26357A" stroke-width="5" marker-end="url(#an)"/>
  <circle cx="110" cy="560" r="7" fill="#26357A"/>
</svg>
